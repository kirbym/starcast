[project]
name = "starcast-backend"
version = "0.1.0"
description = "StarCast API — computes visible celestial bodies and narrates a cosmic weather report"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.5.0",
    "fastapi>=0.115",
    "pandas>=2.2",
    "skyfield>=1.55",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
filterwarnings = [
    # Skyfield's Kepler orbits, used for the Named Comets, still set NumPy array shapes directly.
    "ignore:Setting the shape on a NumPy array:DeprecationWarning:skyfield.keplerlib",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
